name: DevOpsForge CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: devopsforge-api
  EKS_CLUSTER_NAME: devopsforge-dev-eks
  K8S_NAMESPACE: devopsforge
  DEPLOYMENT_NAME: devopsforge-api
  CONTAINER_NAME: devopsforge-api

jobs:
  deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::684018405041:role/DevOpsForge-GitHubActions-Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f app/Dockerfile \
            -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            app/

      - name: Push Docker image to ECR
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      - name: Deploy image to EKS
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl set image \
            deployment/$DEPLOYMENT_NAME \
            $CONTAINER_NAME=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -n $K8S_NAMESPACE

      - name: Wait for rollout
        run: |
          kubectl rollout status \
            deployment/$DEPLOYMENT_NAME \
            -n $K8S_NAMESPACE \
            --timeout=180s

      - name: Verify deployment
        run: |
          kubectl get deployment $DEPLOYMENT_NAME -n $K8S_NAMESPACE
          kubectl get pods -n $K8S_NAMESPACE
